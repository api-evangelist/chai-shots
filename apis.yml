name: Chai Shots
description: >-
  Chai Shots is a Hyderabad-based microdrama OTT streaming platform for vertical,
  short-form fiction where every episode runs under two minutes. Built by the
  Chai Bisket team (co-founders Sharath Chandra and Anurag Reddy), it is positioned
  as India's first regional short-series OTT, launching in Telugu and other regional
  Indian languages for Gen Z and tier II/III audiences. The platform offers
  pay-per-episode and unlimited subscription access, a creator-first "Clap"
  tipping feature, and an AI-native production workflow. It raised a $5M seed round
  co-led by InfoEdge Ventures and General Catalyst. Chai Shots is a consumer content
  app with no public developer/API surface at this time; this profile carries the
  company's identity and published web properties.
